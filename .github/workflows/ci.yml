name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WORKFLOW_ENGINE_TEST_CONNECTION_STRING: "Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore src/WorkflowEngine.sln
      - run: dotnet build src/WorkflowEngine.sln --no-restore
      - run: dotnet format src/WorkflowEngine.sln --verify-no-changes --no-restore
      - run: dotnet test src/WorkflowEngine.sln --no-build --filter "Category!=Smtp&Category!=FreshClone&Category!=Performance"
      - run: dotnet list src/WorkflowEngine.sln package --vulnerable

  smtp-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      smtp4dev:
        image: rnwood/smtp4dev
        ports:
          - 3025:25
    env:
      RUN_SMTP_TESTS: "1"
      WORKFLOW_ENGINE_TEST_CONNECTION_STRING: "Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore src/WorkflowEngine.sln
      - run: dotnet build src/WorkflowEngine.sln --no-restore
      - run: dotnet test src/WorkflowEngine.sln --no-build --filter Category=Smtp

  extended-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WORKFLOW_ENGINE_TEST_CONNECTION_STRING: "Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore src/WorkflowEngine.sln
      - run: dotnet build src/WorkflowEngine.sln --no-restore
      - run: dotnet test src/WorkflowEngine.sln --no-build --filter "Category=FreshClone|Category=Performance"
