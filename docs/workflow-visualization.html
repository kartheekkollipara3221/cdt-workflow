<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDT Workflow Engine — Architecture &amp; Flow Visualization</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2230;
  --border: #21273a;
  --border2: #30364a;
  --text: #e2e8f0;
  --text-muted: #8892a4;
  --text-dim: #3d4a5c;
  --accent: #6366f1;
  --accent-light: #a5b4fc;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
}

/* ── Sidebar ────────────────────────────────────────────────────── */
#sidebar {
  width: 252px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-header {
  padding: 14px 16px 11px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#sidebar-header h1 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}

#sidebar-header p {
  margin-top: 3px;
  font-size: 10px;
  color: var(--text-dim);
}

#flow-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0 16px;
}

.flow-category {
  padding: 10px 16px 3px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.flow-item {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 7px 16px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.12s;
  user-select: none;
}

.flow-item:hover { background: var(--surface2); }

.flow-item.active {
  background: var(--surface2);
  border-left-color: var(--accent);
}

.flow-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--text-dim);
  flex-shrink: 0;
  margin-top: 5px;
  transition: background 0.15s;
}

.flow-item.active .flow-dot { background: var(--accent); }

.flow-name {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.4;
}

.flow-item.active .flow-name { color: var(--text); }

/* ── Main area ──────────────────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

#diagram-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg);
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 32px 32px;
  background-position: -0.5px -0.5px;
}

#diagram {
  width: 100%;
  height: 100%;
  display: block;
}

/* ── Step bar ───────────────────────────────────────────────────── */
#step-bar {
  flex-shrink: 0;
  height: 50px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  transition: opacity 0.2s;
}

#step-bar.hidden { opacity: 0; pointer-events: none; }

.s-btn {
  padding: 5px 11px;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s, color 0.12s;
}

.s-btn:hover:not(:disabled) { background: var(--border2); color: var(--text); }
.s-btn:disabled { opacity: 0.35; cursor: default; }

#step-pips {
  flex: 1;
  display: flex;
  gap: 5px;
  align-items: center;
  overflow: hidden;
}

.pip {
  height: 4px;
  border-radius: 2px;
  background: var(--border2);
  cursor: pointer;
  transition: background 0.2s, flex 0.2s;
  flex: 1;
  min-width: 12px;
}

.pip.done { background: var(--accent); opacity: 0.45; }
.pip.current { background: var(--accent); opacity: 1; }

#step-counter {
  font-size: 10px;
  color: var(--text-dim);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* ── Details panel ──────────────────────────────────────────────── */
#details {
  width: 308px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#details-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 32px;
  text-align: center;
}

#details-empty svg { opacity: 0.15; }

#details-empty p {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
}

#details-content {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

#details-head {
  flex-shrink: 0;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
}

#details-flow-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}

#details-flow-desc {
  margin-top: 5px;
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.55;
}

#details-trigger {
  margin-top: 8px;
  font-size: 10px;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  color: var(--accent-light);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 5px 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#details-steps-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0 16px;
}

.step-row {
  padding: 9px 16px;
  border-left: 2px solid transparent;
  cursor: pointer;
  transition: background 0.12s;
}

.step-row:hover { background: var(--surface2); }

.step-row.current {
  background: var(--surface2);
  border-left-color: var(--accent);
}

.step-row.past { opacity: 0.55; border-left-color: var(--border2); }

.step-row-top {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 5px;
}

.step-num {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: var(--border2);
  font-size: 9px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  flex-shrink: 0;
}

.step-row.current .step-num {
  background: var(--accent);
  color: #fff;
}

.step-row.past .step-num {
  background: rgba(99,102,241,0.35);
  color: var(--accent-light);
}

.step-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}

.step-row.past .step-label { color: var(--text-muted); }

.step-detail {
  font-size: 10.5px;
  color: var(--text-muted);
  line-height: 1.55;
  padding-left: 25px;
  margin-bottom: 4px;
}

.step-data {
  padding-left: 25px;
}

.step-data code {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 9.5px;
  color: #7dd3fc;
  background: rgba(125,211,252,0.06);
  border: 1px solid rgba(125,211,252,0.12);
  border-radius: 3px;
  padding: 2px 5px;
  line-height: 1.6;
  display: inline-block;
  max-width: 100%;
  word-break: break-word;
  white-space: pre-wrap;
}

/* scrollbars */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <h1>CDT Workflow Engine</h1>
    <p>Select a flow to trace it through the architecture</p>
  </div>
  <div id="flow-list"></div>
</aside>

<div id="main">
  <div id="diagram-wrap">
    <svg id="diagram" viewBox="0 0 860 578" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div id="step-bar" class="hidden">
    <button class="s-btn" id="btn-prev">← Prev</button>
    <div id="step-pips"></div>
    <span id="step-counter"></span>
    <button class="s-btn" id="btn-next">Next →</button>
  </div>
</div>

<aside id="details">
  <div id="details-empty">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="1.2">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
    </svg>
    <p>Select a flow from the sidebar to see how data moves between packages step by step.</p>
  </div>
  <div id="details-content">
    <div id="details-head">
      <div id="details-flow-name"></div>
      <div id="details-flow-desc"></div>
      <div id="details-trigger"></div>
    </div>
    <div id="details-steps-list"></div>
  </div>
</aside>

          "data": "(no parameters)",

        },
        {

        },
        {
          "from": "infrastructure", "to": "database",
          "label": "INSERT WorkflowInstance",
          "data": "{ workflowInstanceId: 'WF-PT-1001', currentStateKey: 'Draft', status: 'Active', version: 1, startedAtUtc }",

    {
      "id": "submit-for-checker",
      "name": "Maker: Submit for Checker",
      "category": "Portfolio Trade Workflow",
      "description": "Maker submits the trade for review. Transitions Draft → CheckerReview, creates a CheckerReviewTask with a 2-hour SLA, and queues a WorkflowTaskAssigned notification for the Checker role.",
      "trigger": "$ workflow-engine execute-json 02-submit-for-checker.json",
      "steps": [
        {
          "from": "console", "to": "application",
          "label": "ExecuteJson reads WorkflowActionEnvelope",
          "data": "{ commandType: 'ExecuteWorkflowAction', actor: { userId: 'maker1', roles: ['Maker'] }, uiAction: { buttonKey: 'MakerPrimary', saveAsDraft: false }, workflow: { actionKey: 'SubmitForChecker', expectedCurrentState: 'Draft', expectedInstanceVersion: 1 } }",

          "from": "infrastructure", "to": "database",
          "label": "Atomic transaction: CheckerReview → TradingDeskReview",
          "data": "UPDATE WorkflowInstance SET currentState='TradingDeskReview'; CLOSE CheckerReviewTask; INSERT TradingDeskReviewTask (dueAt=now+120min); INSERT NotificationOutbox (WorkflowTaskAssigned → TradingDesk); INSERT WorkflowAudit",
          "detail": "Closes CheckerReviewTask, creates TradingDeskReviewTask with 2-hour SLA, and notifies the TradingDesk role that a new task is ready."
        }
      ]
    },
    {
      "id": "trading-execute",
      "name": "Trading Desk: Execute Trade",
      "category": "Portfolio Trade Workflow",
      "description": "Trading Desk confirms the trade is executed in the market. Transitions TradingDeskReview → BdrmClientServiceReview for BDRM fulfillment confirmation.",
      "trigger": "$ workflow-engine execute-json 07-trading-trade-executed.json",
      "steps": [
        {
          "from": "console", "to": "application",
          "label": "ExecuteJson: TradingTradeExecuted",
          "data": "WorkflowActionEnvelope { actionKey: 'TradingTradeExecuted', actor: { roles: ['TradingDesk'] }, expectedCurrentState: 'TradingDeskReview' }",
          "detail": "Trading Desk marks the trade as executed in the market."
        },
        {
          "from": "application", "to": "infrastructure",
          "label": "IWorkflowExecutionService.Execute()",
          "data": "WorkflowExecutionRequest validated + normalized",
          "detail": "Delegates to WorkflowExecutionService."
        },
        {
          "from": "infrastructure", "to": "database",
          "label": "Atomic transaction: TradingDeskReview → BdrmClientServiceReview",
          "data": "UPDATE WorkflowInstance SET currentState='BdrmClientServiceReview'; CLOSE TradingDeskReviewTask; INSERT BdrmReviewTask (dueAt=now+120min); INSERT NotificationOutbox (WorkflowTaskAssigned → BDRMClientService); INSERT WorkflowAudit",
          "detail": "Closes TradingDeskReviewTask, creates BdrmReviewTask with 2-hour SLA, and notifies the BDRMClientService role that the trade is ready for fulfillment confirmation."
        }
      ]
    },
    {
      "id": "bdrm-fulfilled",
      "name": "BDRM: Trade Fulfilled",
      "category": "Portfolio Trade Workflow",
      "description": "BDRM confirms trade fulfillment with the client. Transitions BdrmClientServiceReview → Completed (terminal state) and queues a WorkflowCompleted notification back to the Maker.",
      "trigger": "$ workflow-engine execute-json 08-bdrm-trade-fulfilled.json",
      "steps": [
        {
          "from": "console", "to": "application",
          "label": "ExecuteJson: BdrmTradeFulfilled",
          "data": "WorkflowActionEnvelope { actionKey: 'BdrmTradeFulfilled', actor: { roles: ['BDRMClientService'] }, expectedCurrentState: 'BdrmClientServiceReview' }",
          "detail": "BDRM confirms the trade has been fulfilled with the client."
        },
        {
          "from": "application", "to": "infrastructure",
          "label": "IWorkflowExecutionService.Execute()",
          "data": "WorkflowExecutionRequest validated + normalized",
          "detail": "Delegates to WorkflowExecutionService."
        },
        {
          "from": "infrastructure", "to": "database",
          "label": "Atomic transaction: BdrmClientServiceReview → Completed (terminal)",
          "data": "UPDATE WorkflowInstance SET currentState='Completed', status='Completed'; CLOSE BdrmReviewTask; INSERT NotificationOutbox (WorkflowCompleted → Maker); INSERT WorkflowAudit",
          "detail": "Sets WorkflowInstance.Status = 'Completed' — this is a terminal state, no further actions are possible. Closes the BDRM task and notifies the Maker that the workflow is fully complete."
        }
      ]
    },
    {
      "id": "bdrm-reject",
      "name": "BDRM: Trade Not Executed Properly",
      "category": "Portfolio Trade Workflow",
      "description": "BDRM rejects the trade execution and sends it back to the Trading Desk for rework. Transitions BdrmClientServiceReview → TradingDeskRework.",
      "trigger": "$ workflow-engine execute-json 09-bdrm-trade-not-executed.json",
      "steps": [
        {
          "from": "console", "to": "application",
          "label": "ExecuteJson: BdrmTradeNotExecutedProperly",
          "data": "WorkflowActionEnvelope { actionKey: 'BdrmTradeNotExecutedProperly', actor: { roles: ['BDRMClientService'] } }",
          "detail": "BDRM finds an issue with execution and sends the trade back to the Trading Desk."
        },
        {
          "from": "application", "to": "infrastructure",
          "label": "IWorkflowExecutionService.Execute()",
          "data": "WorkflowExecutionRequest validated + normalized",
          "detail": "Delegates to WorkflowExecutionService."
        },
        {
          "from": "infrastructure", "to": "database",
          "label": "Atomic transaction: BdrmClientServiceReview → TradingDeskRework",
          "data": "UPDATE WorkflowInstance SET currentState='TradingDeskRework'; CLOSE BdrmReviewTask; INSERT TradingDeskReworkTask (dueAt=now+120min); INSERT NotificationOutbox (WorkflowReturnedToTradingDesk → TradingDesk); INSERT WorkflowAudit",
          "detail": "Closes BdrmReviewTask, creates TradingDeskReworkTask with a 2-hour SLA, and notifies the TradingDesk role to re-examine and re-execute the trade."
        }
      ]
    },
    {
      "id": "run-sla",
      "name": "Run SLA Check",
      "category": "System Operations",
      "description": "Scans all pending workflow tasks for overdue items (past DueAtUtc) and queues SlaTaskOverdue notifications. Fully idempotent — only one overdue notification is ever queued per task.",
      "trigger": "$ workflow-engine run-sla --now \"2030-01-15T16:00:00Z\"",
      "steps": [
        {
          "from": "console", "to": "application",
          "label": "RunSla command",
          "data": "{ referenceTime: '2030-01-15T16:00:00Z' }",
          "detail": "Console dispatches the RunSla command with an optional --now timestamp override (defaults to TimeProvider.GetUtcNow()). The injected TimeProvider makes SLA logic fully testable."
        },
        {
          "from": "application", "to": "infrastructure",
          "label": "IRunSlaService.RunAsync()",
          "data": "RunSlaRequest { referenceTime: DateTimeOffset }",
          "detail": "Application delegates to RunSlaService in Infrastructure."
        },
        {
          "from": "infrastructure", "to": "database",
          "label": "Scan overdue tasks + queue SlaTaskOverdue notifications",
          "data": "SELECT WorkflowTask WHERE status='Pending' AND dueAtUtc < referenceTime AND taskId NOT IN (SELECT workflowTaskId FROM NotificationOutbox WHERE type='SlaTaskOverdue'); INSERT NotificationOutbox (SlaTaskOverdue) per overdue task",
          "detail": "Finds pending tasks past their SLA due date that have not already been flagged. Inserts one SlaTaskOverdue notification per qualifying task. The NOT EXISTS check makes this idempotent — running repeatedly never double-notifies."
        }
      ]
    },
    {
      "id": "process-notifications",
      "name": "Process Notification Outbox",
      "category": "System Operations",
      "description": "Sends all pending notifications from the outbox via the configured sender (Console print or SMTP email). Uses the outbox pattern to decouple notification delivery from workflow state transitions.",
      "trigger": "$ workflow-engine process-notification-outbox",
      "steps": [
        {
          "from": "console", "to": "application",
          "label": "ProcessNotifications command",
          "data": "(no parameters)",
          "detail": "Console dispatches ProcessNotifications to Application's ProcessNotificationsHandler."
        },
        {
          "from": "application", "to": "infrastructure",
          "label": "IProcessNotificationOutboxService.ProcessAsync()",
          "data": "CancellationToken",
          "detail": "Application delegates to ProcessNotificationOutboxService in Infrastructure."
        },
        {
          "from": "infrastructure", "to": "database",
          "label": "Load pending notifications",
          "data": "SELECT NotificationOutbox WHERE status='Pending' ORDER BY createdAt ASC",
          "detail": "Queries the NotificationOutbox table for all unsent rows: WorkflowTaskAssigned, WorkflowReturnedToMaker, WorkflowCompleted, and SlaTaskOverdue notifications."
        },
        {
          "from": "infrastructure", "to": "notifications",
          "label": "INotificationSender.SendAsync()",
          "data": "NotificationDelivery { type, recipientRoleKey, workflowInstanceId, taskKey, dueAtUtc }",
          "detail": "Calls the configured INotificationSender: ConsoleNotificationSender (prints to stdout), SmtpNotificationSender (sends email via MailKit using RoleEmailMap config to resolve recipient addresses), or NoOpNotificationSender (discards silently). Failed sends mark the row as Failed rather than throwing."
        },
        {
          "from": "infrastructure", "to": "database",
          "label": "UPDATE NotificationOutbox status",
          "data": "UPDATE NotificationOutbox SET status='Sent'|'Failed', sentAt=now WHERE id=...",
          "detail": "After each send attempt, marks the row as Sent or Failed. Sent rows are never re-processed. Failed rows can be retried on the next run."
        }
      ]
    },
    {
      "id": "idempotent-replay",
      "name": "Idempotent Action Replay",
      "category": "System Operations",
      "description": "When the same action is submitted twice (network retry, duplicate button click), the engine returns the cached result without re-executing — preventing duplicate state transitions, tasks, or notifications.",
      "trigger": "$ workflow-engine execute-json 02-submit-for-checker.json  # sent a second time",
      "steps": [
        {
          "from": "console", "to": "application",
          "label": "ExecuteJson (duplicate request)",
          "data": "WorkflowActionEnvelope with the same clientActionId or idempotencyKey as a previous request",
          "detail": "The same action JSON is submitted again — could be a network retry, a UI double-click, or an at-least-once delivery system."
        },
        {
          "from": "application", "to": "infrastructure",
          "label": "IWorkflowExecutionService.Execute()",
          "data": "WorkflowExecutionRequest { idempotencyKey: 'sample-02-submit-for-checker', requestHash: 'abc123...' }",
          "detail": "Application forwards the request as normal — the Normalizer computes the same idempotency key as the first call. Idempotency is enforced inside the execution service."
        },
        {
          "from": "infrastructure", "to": "database",
          "label": "Idempotency lookup → HIT, return cached result",
          "data": "SELECT IdempotencyRecord WHERE key='sample-02-submit-for-checker' → FOUND; requestHash matches → return StoredResult JSON; no writes to WorkflowInstance, WorkflowTask, NotificationOutbox, or WorkflowAudit",
          "detail": "WorkflowExecutionService finds the IdempotencyRecord. It verifies the RequestHash matches to confirm it is the same request (a different request using the same key returns IdempotencyConflict). If matching, returns the stored WorkflowActionResult verbatim — zero side effects. Safe to call any number of times."
        }
      ]
    },
    {
      "id": "api-execute",
      "name": "API: Execute Action (HTTP)",
      "category": "REST API Flows",
      "description": "A form UI (React / Angular) calls the REST API to execute a workflow action. The API resolves the actor from JWT claims and runs through the identical Application/Infrastructure pipeline as the Console path.",
      "trigger": "POST /api/workflows/instances/{workflowInstanceId}/actions",
      "steps": [
        {
          "from": "api", "to": "application",
          "label": "HTTP POST → WorkflowActionEnvelope",
          "data": "Request body (JSON WorkflowActionEnvelope) + actor resolved from JWT claims via ClaimsActorResolver { userId, roles extracted from ClaimsPrincipal }",
          "detail": "WorkflowActionsController receives the HTTP POST. ClaimsActorResolver reads userId and role claims from the JWT principal and injects them into the envelope, replacing the actor that would otherwise come from the CLI args."
        },
        {
          "from": "application", "to": "infrastructure",
          "label": "IWorkflowExecutionService.Execute()",
          "data": "WorkflowExecutionRequest (identical contract to Console path)",
          "detail": "Identical Application → Infrastructure call. The only difference from the Console path is how the actor was resolved. All validation, normalization, idempotency, concurrency, and state transition logic is the same."
        },
        {
          "from": "infrastructure", "to": "database",
          "label": "Atomic state transition (same as Console)",
          "data": "UPDATE WorkflowInstance; INSERT/UPDATE WorkflowTask; INSERT NotificationOutbox; INSERT WorkflowAudit; INSERT IdempotencyRecord",
          "detail": "Full execution including idempotency check, optimistic concurrency guard, state transition, task management, notification queuing, and audit writing. WorkflowHttpResultMapper then maps the ResultCode to HTTP status: Success→200, ConcurrencyConflict→409, Forbidden→403, ValidationFailed→422."
        }
      ]
    },
    {
      "id": "api-context",
      "name": "API: Get Workflow Context (HTTP)",
      "category": "REST API Flows",
      "description": "A form UI requests the current workflow context on page load. Returns state, active task, SLA status, and available action buttons — the API equivalent of show-context.",
      "trigger": "GET /api/workflows/instances/{workflowInstanceId}/context",
      "steps": [
        {
          "from": "api", "to": "application",
          "label": "GET context → actor from JWT claims",
          "data": "workflowInstanceId (path param) + actor resolved from ClaimsPrincipal { userId, roles }",
          "detail": "WorkflowContextController receives the GET request. ClaimsActorResolver resolves the caller's identity from the JWT token and builds the WorkflowContextReadRequest."
        },
        {
          "from": "application", "to": "infrastructure",
          "label": "IWorkflowContextReader.Read()",
          "data": "WorkflowContextReadRequest { workflowInstanceId, actor }",
          "detail": "Application delegates to WorkflowContextReader in Infrastructure."
        },
        {
          "from": "infrastructure", "to": "database",
          "label": "Query state + task + available actions",
          "data": "SELECT WorkflowInstance; SELECT WorkflowTask WHERE status='Pending'; SELECT TransitionDefinition WHERE fromState=current AND role IN actor.roles → WorkflowContextResponse { currentState, canAct, sla: { status, dueAtUtc }, availableActions: [...] }",
          "detail": "Returns the full WorkflowContextResponse: current state, canAct flag (does this actor have any available transitions?), pending task with SLA status, and the list of available action buttons for the UI to render."
        }
      ]
    }
  ]
}
</script>

<script>
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const raw = JSON.parse(document.getElementById('app-data').textContent);
  const { packages, baseEdges, flows } = raw;
  const pkgMap = Object.fromEntries(packages.map(p => [p.id, p]));

  let activeFlow = null;
  let activeStep = 0;

  // ── Helpers ──────────────────────────────────────────────────────────────────

  function el(tag, attrs = {}, children = []) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    children.forEach(c => e.appendChild(c));
    return e;
  }

  function txt(tag, attrs, text) {
    const e = el(tag, attrs);
    e.textContent = text;
    return e;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function edgeKey(from, to) { return `${from}::${to}`; }

  // Get connection point on a package node
  function port(pkg, dir) {
    const cx = pkg.x + pkg.w / 2;
    const cy = pkg.y + pkg.h / 2;
    if (dir === 'top')    return { x: cx,          y: pkg.y          };
    if (dir === 'bottom') return { x: cx,          y: pkg.y + pkg.h  };
    if (dir === 'left')   return { x: pkg.x,       y: cy             };
    if (dir === 'right')  return { x: pkg.x + pkg.w, y: cy           };
    return { x: cx, y: cy };
  }

  // Pick best port pair for an edge
  function bestPorts(a, b) {
    const acx = a.x + a.w / 2, acy = a.y + a.h / 2;
    const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
    const dx = bcx - acx, dy = bcy - acy;
    if (Math.abs(dy) >= Math.abs(dx)) {
      return dy >= 0
        ? { aDir: 'bottom', bDir: 'top' }
        : { aDir: 'top',    bDir: 'bottom' };
    }
    return dx >= 0
      ? { aDir: 'right', bDir: 'left' }
      : { aDir: 'left',  bDir: 'right' };
  }

  // Build SVG cubic bezier path string
  function bezier(x1, y1, x2, y2, aDir, bDir) {
    const d = Math.hypot(x2 - x1, y2 - y1);
    const t = Math.min(d * 0.45, 90);
    let c1x = x1, c1y = y1, c2x = x2, c2y = y2;
    if (aDir === 'bottom') c1y += t;
    else if (aDir === 'top') c1y -= t;
    else if (aDir === 'right') c1x += t;
    else if (aDir === 'left') c1x -= t;
    if (bDir === 'top') c2y -= t;
    else if (bDir === 'bottom') c2y += t;
    else if (bDir === 'left') c2x -= t;
    else if (bDir === 'right') c2x += t;
    return `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;
  }

  // ── Build SVG ────────────────────────────────────────────────────────────────

  const svg = document.getElementById('diagram');

  // Defs: arrowheads
  const defs = el('defs');
  function arrowMarker(id, color) {
    return el('marker', { id, markerWidth: '9', markerHeight: '9', refX: '7', refY: '3.5', orient: 'auto' }, [
      el('path', { d: 'M 0 0 L 9 3.5 L 0 7 Z', fill: color })
    ]);
  }
  defs.appendChild(arrowMarker('arr-dim',     '#21273a'));
  defs.appendChild(arrowMarker('arr-default', '#30364a'));
  defs.appendChild(arrowMarker('arr-past',    '#6366f1'));
  defs.appendChild(arrowMarker('arr-current', '#a5b4fc'));
  svg.appendChild(defs);

  const layerEdge = el('g', { id: 'layer-edges' });
  const layerNode = el('g', { id: 'layer-nodes' });
  svg.appendChild(layerEdge);
  svg.appendChild(layerNode);

  // Draw base edges
  const edgeEls = {}; // key → SVGPathElement

  for (const edge of baseEdges) {
    const a = pkgMap[edge.from];
    const b = pkgMap[edge.to];
    if (!a || !b) continue;
    const { aDir, bDir } = bestPorts(a, b);
    const p1 = port(a, aDir);
    const p2 = port(b, bDir);
    // Offset slightly to avoid exact overlap when multiple edges share same pair
    const d = bezier(p1.x, p1.y, p2.x, p2.y, aDir, bDir);
    const path = el('path', {
      d,
      fill: 'none',
      stroke: '#30364a',
      'stroke-width': '1.5',
      'marker-end': 'url(#arr-default)',
      'stroke-linecap': 'round'
    });
    layerEdge.appendChild(path);
    edgeEls[edgeKey(edge.from, edge.to)] = path;
  }

  // Draw package nodes
  const nodeEls = {}; // id → { g, rect }

  for (const pkg of packages) {
    const g = el('g', { class: 'pkg-node', 'data-id': pkg.id, style: 'cursor:default' });

    // Drop shadow
    g.appendChild(el('rect', {
      x: pkg.x + 3, y: pkg.y + 3,
      width: pkg.w, height: pkg.h,
      rx: '8', fill: 'rgba(0,0,0,0.5)'
    }));

    // Body
    const rect = el('rect', {
      x: pkg.x, y: pkg.y,
      width: pkg.w, height: pkg.h,
      rx: '8',
      fill: '#161b22',
      stroke: pkg.color,
      'stroke-width': '1.5'
    });
    g.appendChild(rect);

    // Top color bar
    g.appendChild(el('rect', {
      x: pkg.x, y: pkg.y,
      width: pkg.w, height: '5',
      rx: '0', fill: pkg.color
    }));
    g.appendChild(el('rect', {
      x: pkg.x, y: pkg.y + 3,
      width: pkg.w, height: '2',
      fill: pkg.color
    }));

    // Label
    g.appendChild(txt('text', {
      x: pkg.x + pkg.w / 2, y: pkg.y + 21,
      'text-anchor': 'middle',
      fill: '#e2e8f0',
      'font-size': '11.5',
      'font-weight': '600',
      'font-family': '-apple-system, BlinkMacSystemFont, sans-serif'
    }, pkg.label));

    // Sublabel (package name)
    g.appendChild(txt('text', {
      x: pkg.x + pkg.w / 2, y: pkg.y + 33,
      'text-anchor': 'middle',
      fill: '#3d4a5c',
      'font-size': '8.5',
      'font-family': "'SF Mono','Cascadia Code','Fira Code',monospace"
    }, pkg.sublabel));

    // Components list
    if (pkg.h >= 80) {
      const available = Math.floor((pkg.h - 42) / 11);
      const shown = Math.min(pkg.components.length, available);
      for (let i = 0; i < shown; i++) {
        g.appendChild(txt('text', {
          x: pkg.x + 9, y: pkg.y + 46 + i * 11,
          fill: '#2d3a4a',
          'font-size': '8',
          'font-family': "'SF Mono','Cascadia Code','Fira Code',monospace"
        }, '· ' + pkg.components[i]));
      }
      if (pkg.components.length > shown) {
        g.appendChild(txt('text', {
          x: pkg.x + 9, y: pkg.y + 46 + shown * 11,
          fill: '#263040',
          'font-size': '7.5',
          'font-family': '-apple-system, sans-serif'
        }, `+${pkg.components.length - shown} more`));
      }
    }

    layerNode.appendChild(g);
    nodeEls[pkg.id] = { g, rect };
  }

  // ── Flow sidebar ─────────────────────────────────────────────────────────────

  const flowListEl = document.getElementById('flow-list');
  const categories = [...new Set(flows.map(f => f.category))];

  for (const cat of categories) {
    const catDiv = document.createElement('div');
    catDiv.className = 'flow-category';
    catDiv.textContent = cat;
    flowListEl.appendChild(catDiv);

    for (const flow of flows.filter(f => f.category === cat)) {
      const item = document.createElement('div');
      item.className = 'flow-item';
      item.dataset.id = flow.id;
      item.setAttribute('role', 'button');
      item.setAttribute('tabindex', '0');
      item.innerHTML = `<div class="flow-dot"></div><div class="flow-name">${esc(flow.name)}</div>`;
      item.addEventListener('click', () => selectFlow(flow.id));
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectFlow(flow.id); }
      });
      flowListEl.appendChild(item);
    }
  }

  // ── Details panel ─────────────────────────────────────────────────────────────

  const detailsEmpty   = document.getElementById('details-empty');
  const detailsContent = document.getElementById('details-content');
  const detailsName    = document.getElementById('details-flow-name');
  const detailsDesc    = document.getElementById('details-flow-desc');
  const detailsTrigger = document.getElementById('details-trigger');
  const detailsList    = document.getElementById('details-steps-list');

  const stepBar     = document.getElementById('step-bar');
  const stepPips    = document.getElementById('step-pips');
  const stepCounter = document.getElementById('step-counter');
  const btnPrev     = document.getElementById('btn-prev');
  const btnNext     = document.getElementById('btn-next');

  btnPrev.addEventListener('click', () => { if (activeStep > 0) goStep(activeStep - 1); });
  btnNext.addEventListener('click', () => {
    if (activeFlow && activeStep < activeFlow.steps.length - 1) goStep(activeStep + 1);
  });

  // ── Flow selection ───────────────────────────────────────────────────────────

  function selectFlow(id) {
    activeFlow = flows.find(f => f.id === id) || null;
    if (!activeFlow) return;
    activeStep = 0;

    // Sidebar highlight
    document.querySelectorAll('.flow-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });

    // Show details panel
    detailsEmpty.style.display = 'none';
    detailsContent.style.display = 'flex';
    detailsName.textContent = activeFlow.name;
    detailsDesc.textContent = activeFlow.description;
    detailsTrigger.textContent = activeFlow.trigger;

    // Build step rows
    detailsList.innerHTML = '';
    activeFlow.steps.forEach((step, i) => {
      const a = pkgMap[step.from];
      const b = pkgMap[step.to];
      const fromLabel = a ? a.label : step.from;
      const toLabel   = b ? b.label : step.to;
      const arrow = fromLabel === toLabel ? `${fromLabel} (internal)` : `${fromLabel} → ${toLabel}`;

      const row = document.createElement('div');
      row.className = 'step-row';
      row.dataset.step = i;
      row.innerHTML = `
        <div class="step-row-top">
          <div class="step-num">${i + 1}</div>
          <div class="step-label">${esc(step.label)}</div>
        </div>
        <div class="step-detail">${esc(step.detail)}</div>
        <div class="step-data"><code>${esc(step.data)}</code></div>
      `;
      row.addEventListener('click', () => goStep(i));
      detailsList.appendChild(row);
    });

    // Build pips
    stepPips.innerHTML = '';
    activeFlow.steps.forEach((_, i) => {
      const pip = document.createElement('div');
      pip.className = 'pip';
      pip.addEventListener('click', () => goStep(i));
      stepPips.appendChild(pip);
    });

    stepBar.classList.remove('hidden');
    goStep(0);
  }

  function goStep(n) {
    if (!activeFlow) return;
    activeStep = n;

    // Update pips
    document.querySelectorAll('.pip').forEach((pip, i) => {
      pip.className = 'pip' + (i < n ? ' done' : i === n ? ' current' : '');
    });

    // Update step rows
    document.querySelectorAll('.step-row').forEach((row, i) => {
      row.className = 'step-row' + (i < n ? ' past' : i === n ? ' current' : '');
    });

    // Scroll into view
    const rows = document.querySelectorAll('.step-row');
    if (rows[n]) rows[n].scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    btnPrev.disabled = n === 0;
    btnNext.disabled = n === activeFlow.steps.length - 1;
    stepCounter.textContent = `${n + 1} / ${activeFlow.steps.length}`;

    renderDiagram(n);
  }

  // ── Diagram rendering ────────────────────────────────────────────────────────

  function renderDiagram(stepIndex) {
    if (!activeFlow) { resetDiagram(); return; }

    const steps = activeFlow.steps;
    const involvedNodes = new Set();
    const activeKeys = new Set(); // steps 0..stepIndex
    const curKey = edgeKey(steps[stepIndex].from, steps[stepIndex].to);

    steps.forEach((s, i) => {
      involvedNodes.add(s.from);
      involvedNodes.add(s.to);
      if (i <= stepIndex) activeKeys.add(edgeKey(s.from, s.to));
    });

    // Nodes
    for (const [id, { g, rect }] of Object.entries(nodeEls)) {
      const pkg = pkgMap[id];
      const involved = involvedNodes.has(id);
      g.style.opacity = involved ? '1' : '0.2';

      const isCurrentPkg =
        steps[stepIndex].from === id || steps[stepIndex].to === id;

      rect.setAttribute('stroke', pkg.color);
      if (isCurrentPkg) {
        rect.setAttribute('stroke-width', '2.5');
        rect.setAttribute('filter', `drop-shadow(0 0 7px ${pkg.color}88)`);
      } else if (involved) {
        rect.setAttribute('stroke-width', '1.8');
        rect.removeAttribute('filter');
      } else {
        rect.setAttribute('stroke-width', '1.5');
        rect.removeAttribute('filter');
      }
    }

    // Edges
    for (const [key, path] of Object.entries(edgeEls)) {
      if (!activeKeys.has(key)) {
        // not yet reached — check if it belongs to the flow at all
        const belongsToFlow = steps.some(s => edgeKey(s.from, s.to) === key);
        path.setAttribute('stroke', belongsToFlow ? '#21273a' : '#1c2230');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('stroke-dasharray', belongsToFlow ? '4 4' : 'none');
        path.setAttribute('marker-end', 'url(#arr-dim)');
        path.style.opacity = belongsToFlow ? '0.5' : '0.15';
      } else if (key === curKey) {
        path.setAttribute('stroke', '#a5b4fc');
        path.setAttribute('stroke-width', '3');
        path.setAttribute('stroke-dasharray', 'none');
        path.setAttribute('marker-end', 'url(#arr-current)');
        path.style.opacity = '1';
      } else {
        path.setAttribute('stroke', '#6366f1');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('stroke-dasharray', 'none');
        path.setAttribute('marker-end', 'url(#arr-past)');
        path.style.opacity = '0.65';
      }
    }
  }

  function resetDiagram() {
    for (const [id, { g, rect }] of Object.entries(nodeEls)) {
      g.style.opacity = '1';
      rect.setAttribute('stroke', pkgMap[id].color);
      rect.setAttribute('stroke-width', '1.5');
      rect.removeAttribute('filter');
    }
    for (const path of Object.values(edgeEls)) {
      path.setAttribute('stroke', '#30364a');
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('stroke-dasharray', 'none');
      path.setAttribute('marker-end', 'url(#arr-default)');
      path.style.opacity = '1';
    }
  }

  // ── Keyboard navigation ───────────────────────────────────────────────────────

  document.addEventListener('keydown', e => {
    if (!activeFlow) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (activeStep < activeFlow.steps.length - 1) goStep(activeStep + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (activeStep > 0) goStep(activeStep - 1);
    }
  });

  // Click empty SVG area to deselect
  svg.addEventListener('click', e => {
    if (e.target === svg) resetDiagram();
  });

})();
</script>
</body>
</html>
